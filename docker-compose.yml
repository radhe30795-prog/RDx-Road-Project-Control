services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rdx}
      MYSQL_USER: ${MYSQL_USER:-rdx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # App talks to the db service; single source of truth for credentials.
      DATABASE_URL: mysql://${MYSQL_USER:-rdx}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-rdx}
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # One-off database migration runner (uses the build image, which has dev deps).
  # Run once after first deploy and after schema changes:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-rdx}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-rdx}
    depends_on:
      db:
        condition: service_healthy
    command: ["pnpm", "exec", "drizzle-kit", "migrate"]

volumes:
  db_data:
