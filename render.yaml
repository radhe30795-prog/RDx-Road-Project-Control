# Render Blueprint — free-tier deploy of RDx Road Project Control.
# Usage: Render Dashboard -> New -> Blueprint -> connect this repo (or upload),
# then fill the `sync: false` values (DATABASE_URL from TiDB Cloud, Firebase,
# R2 keys). Nothing here costs money on the free plan.
services:
  - type: web
    name: rdx-road-control
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # --- Database: TiDB Cloud Serverless (free, MySQL-compatible) ---
      # Create a free cluster at https://tidbcloud.com -> Connect -> get the
      # connection string, e.g.
      # mysql://<user>:<pass>@<host>:4000/rdx
      - key: DATABASE_URL
        sync: false
      # TiDB Cloud requires TLS
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      # Public URL of this Render service (set after first deploy), e.g.
      # https://rdx-road-control.onrender.com
      - key: APP_BASE_URL
        sync: false
      # --- Google login (Firebase, free) ---
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # --- File storage: Firebase Cloud Storage (free 5 GB, no card needed) ---
      # STORAGE_BACKEND=firebase (default) or "s3" for S3/R2 via S3_* vars.
      - key: STORAGE_BACKEND
        value: firebase
      # Service-account JSON (raw or base64). Generate free, no card:
      # Firebase console -> Project settings -> Service accounts ->
      # Generate new private key. Paste the whole downloaded JSON here.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
